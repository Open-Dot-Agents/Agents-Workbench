name: MCP servers

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '41 5 * * 1'

permissions:
  contents: read

jobs:
  package-conformance:
    name: Package installation, audit, and startup
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: conformance/mcp-servers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: conformance/mcp-servers/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - run: npm test
