version: 3

tasks:
  default:
    cmds:
      - task: deterministic
      - task: codex
      - task: copilot
      - task: opencode
  deterministic:
    desc: Run all deterministic tests without native credentials
    cmds:
      - python3 -m unittest discover -s task/test -p '*_test.py'
  projections:
    desc: Verify MCP adapter projections match the canonical configuration
    cmds:
      - python3 task/test/mcp_projections_test.py
  codex:
    cmds:
      - codex mcp list
  copilot:
    cmds:
      - copilot mcp list
  opencode:
    cmds:
      - opencode mcp list